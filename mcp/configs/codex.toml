# TokenFin MCP — Codex config
# Copy this block into ~/.codex/config.toml
# (works for both Codex CLI and the Codex VS Code extension)

[mcp_servers.tokenfin]
command = "node"
args = ["/Users/mac/tokenfin/mcp/dist/index.js"]

[mcp_servers.tokenfin.env]
TOKENFIN_API_KEY = "PASTE_YOUR_API_KEY_HERE"
TOKENFIN_BASE_URL = "http://localhost:3000"

# ── Optional tweaks ──────────────────────────────
# startup_timeout_sec = 10    # default 10s
# tool_timeout_sec    = 60    # default 60s
# enabled             = true  # set false to disable without deleting
