name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Next.js web ─────────────────────────────────────────────────────────────
  web:
    name: "Web — typecheck + lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # ── Go backend ──────────────────────────────────────────────────────────────
  go:
    name: "Go — vet + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: build ingest
        run: go build -o /dev/null ./cmd/ingest

      - name: build worker
        run: go build -o /dev/null ./cmd/worker

  # ── Docker build smoke test ─────────────────────────────────────────────────
  docker:
    name: "Docker — build images"
    runs-on: ubuntu-latest
    # Only run on push to main/dev — skip for every PR to save minutes
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ingest image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.ingest
          push: false
          cache-from: type=gha,scope=ingest
          cache-to:   type=gha,scope=ingest,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to:   type=gha,scope=worker,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to:   type=gha,scope=web,mode=max

  # ── SDK typecheck ───────────────────────────────────────────────────────────
  sdk:
    name: "SDK — typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run typecheck
