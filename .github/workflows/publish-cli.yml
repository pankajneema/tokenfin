name: Publish CLI

# Manual only. Run from Actions → "Publish CLI" → Run workflow.
# Publishes cli/ as the public `tokenfin` package on npm.
# Requires repository secret NPM_TOKEN (npm automation token with publish
# rights on `tokenfin`).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test + pack only, do not publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Syntax-check every file that ships
        run: for f in bin/*.js lib/*.js; do node --check "$f"; done
      - name: Check version is not already published
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "tokenfin@$V" version >/dev/null 2>&1; then
            echo "::error::tokenfin@$V is already on npm — bump cli/package.json"; exit 1
          fi
      - run: npm pack --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
