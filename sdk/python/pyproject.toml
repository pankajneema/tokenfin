[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "tokenfin"
version         = "0.1.0"
description     = "TokenFin Python SDK — LLM cost attribution and FinOps"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"
keywords        = ["llm", "cost", "tokens", "observability", "finops"]
classifiers     = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []   # zero required deps for the sync client

[project.optional-dependencies]
async = ["aiohttp>=3.9"]
dev   = ["pytest>=8", "pytest-asyncio>=0.23", "aiohttp>=3.9", "responses>=0.25"]

[project.urls]
Homepage      = "https://tokenfin.io"
Documentation = "https://docs.tokenfin.io"
Repository    = "https://github.com/tokenfin/tokenfin-py"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenfin*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
