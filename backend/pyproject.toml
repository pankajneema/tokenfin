[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "tokenfin-backend"
version     = "0.1.0"
description = "TokenFin FastAPI backend — LLM Cost Attribution & FinOps"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "supabase==2.7.4",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "python-dotenv==1.0.1",
  "httpx==0.27.2",
  "apscheduler==3.10.4",
  "aiosmtplib==3.0.1",
  "email-validator==2.2.0",
  "tenacity==9.0.0",
  "structlog==24.4.0",
  "prometheus-client==0.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-asyncio==0.23.8",
  "httpx==0.27.2",
  "ruff==0.6.4",
  "mypy==1.11.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select  = ["E", "F", "I", "UP", "B", "SIM"]
ignore  = ["E501"]

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
